<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav>

    <div class="logo">
        AutoCare
    </div>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/cars}">
        My Cars
    </a>

    <a th:href="@{/appointments}">
        Appointments
    </a>

    <a th:href="@{/services}">
        Services
    </a>

    <a th:href="@{/users/profile}">
        Profile
    </a>

</nav>

<div class="container">

    <header class="page-header">

        <h1>
            My Profile
        </h1>

        <p>
            View and update your AutoCare
            account information.
        </p>

    </header>

    <p class="success-message"
       th:if="${param.updated}">
        Profile updated successfully.
    </p>

    <div class="card">

        <h3>
            Account
        </h3>

        <p>
            Username:
            <strong th:text="${username}">
            </strong>
        </p>

        <p>
            Account role:
            <span class="badge"
                  th:text="${role}">
            </span>
        </p>

    </div>

    <form th:action="@{/users/profile}"
          th:object="${profileRequest}"
          method="post">

        <h2>
            Personal Information
        </h2>

        <div>

            <label for="firstName">
                First Name
            </label>

            <input id="firstName"
                   type="text"
                   th:field="*{firstName}">

            <p th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}">
            </p>

        </div>

        <div>

            <label for="lastName">
                Last Name
            </label>

            <input id="lastName"
                   type="text"
                   th:field="*{lastName}">

            <p th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}">
            </p>

        </div>

        <div class="error-message"
             th:if="${#fields.hasGlobalErrors()}">

            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>

        </div>

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>

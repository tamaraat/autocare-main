<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Appointments | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav>

    <div class="logo">
        AutoCare Admin
    </div>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/admin/services}">
        Services
    </a>

    <a th:href="@{/admin/appointments}">
        Appointments
    </a>

    <a th:href="@{/admin/parts}">
        Parts
    </a>

    <a th:href="@{/admin/users}">
        Users
    </a>

</nav>

<div class="container">

    <header class="page-header">

        <h1>
            Manage Appointments
        </h1>

        <p>
            Review and confirm customer
            service appointments.
        </p>

    </header>

    <p class="success-message"
       th:if="${param.confirmed}">
        Appointment confirmed successfully.
    </p>

    <div class="card"
         th:if="${#lists.isEmpty(appointments)}">

        <h3>
            No appointments
        </h3>

        <p>
            There are currently no customer
            appointments.
        </p>

    </div>

    <table th:unless="${#lists.isEmpty(appointments)}">

        <thead>

        <tr>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Registration</th>
            <th>Service</th>
            <th>Date & Time</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="appointment : ${appointments}">

            <td th:text="${appointment.car.owner.username}">
            </td>

            <td>
                <strong th:text="${appointment.car.make + ' ' + appointment.car.model}">
                </strong>
            </td>

            <td>
                <span class="badge"
                      th:text="${appointment.car.registrationNumber}">
                </span>
            </td>

            <td th:text="${appointment.serviceOffer.name}">
            </td>

            <td th:text="${#temporals.format(appointment.appointmentTime, 'dd.MM.yyyy HH:mm')}">
            </td>

            <td>

                <span class="badge"
                      th:text="${appointment.status}">
                </span>

            </td>

            <td>

                <form th:if="${appointment.status.name() == 'PENDING'}"
                      th:action="@{/admin/appointments/confirm/{id}(id=${appointment.id})}"
                      method="post">

                    <button type="submit">
                        Confirm
                    </button>

                </form>

                <span th:unless="${appointment.status.name() == 'PENDING'}"
                      th:text="${appointment.status}">
                </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>

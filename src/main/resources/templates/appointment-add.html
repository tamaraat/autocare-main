<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Appointment | AutoCare</title>
</head>

<body>

<h1>Book Service Appointment</h1>

<div th:if="${#lists.isEmpty(cars)}">

    <p>
        You need to add a car before
        booking an appointment.
    </p>

    <a th:href="@{/cars/add}">
        Add Car
    </a>

</div>

<div th:if="${#lists.isEmpty(services)}">

    <p>
        There are currently no available
        service offers.
    </p>

</div>

<form
        th:unless="${#lists.isEmpty(cars) or #lists.isEmpty(services)}"
        th:action="@{/appointments/add}"
        th:object="${appointmentRequest}"
        method="post">

    <div>

        <label for="carId">
            Car
        </label>

        <select id="carId"
                th:field="*{carId}">

            <option value="">
                Select your car
            </option>

            <option
                    th:each="car : ${cars}"
                    th:value="${car.id}"
                    th:text="${car.make + ' ' + car.model + ' - ' + car.registrationNumber}">
            </option>

        </select>

        <p th:if="${#fields.hasErrors('carId')}"
           th:errors="*{carId}">
        </p>

    </div>

    <br>

    <div>

        <label for="serviceOfferId">
            Service
        </label>

        <select id="serviceOfferId"
                th:field="*{serviceOfferId}">

            <option value="">
                Select service
            </option>

            <option
                    th:each="service : ${services}"
                    th:value="${service.id}"
                    th:text="${service.name + ' - ' + service.price + ' €'}">
            </option>

        </select>

        <p th:if="${#fields.hasErrors('serviceOfferId')}"
           th:errors="*{serviceOfferId}">
        </p>

    </div>

    <br>

    <div>

        <label for="appointmentTime">
            Date and Time
        </label>

        <input
                id="appointmentTime"
                type="datetime-local"
                th:field="*{appointmentTime}">

        <p th:if="${#fields.hasErrors('appointmentTime')}"
           th:errors="*{appointmentTime}">
        </p>

    </div>

    <div th:if="${#fields.hasGlobalErrors()}">

        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}">
        </p>

    </div>

    <br>

    <button type="submit">
        Book Appointment
    </button>

</form>

<br>

<a th:href="@{/appointments}">
    Back to My Appointments
</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p style="text-align: center;">
            Join AutoCare and manage your vehicle
            maintenance online.
        </p>

        <form th:action="@{/users/register}"
              th:object="${registerRequest}"
              method="post">

            <div>

                <label for="username">
                    Username
                </label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       placeholder="Choose a username">

                <p th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>

            </div>

            <div>

                <label for="firstName">
                    First Name
                </label>

                <input id="firstName"
                       type="text"
                       th:field="*{firstName}"
                       placeholder="Your first name">

                <p th:if="${#fields.hasErrors('firstName')}"
                   th:errors="*{firstName}">
                </p>

            </div>

            <div>

                <label for="lastName">
                    Last Name
                </label>

                <input id="lastName"
                       type="text"
                       th:field="*{lastName}"
                       placeholder="Your last name">

                <p th:if="${#fields.hasErrors('lastName')}"
                   th:errors="*{lastName}">
                </p>

            </div>

            <div>

                <label for="password">
                    Password
                </label>

                <input id="password"
                       type="password"
                       th:field="*{password}"
                       placeholder="Create a password">

                <p th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>

            </div>

            <div>

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       placeholder="Repeat your password">

                <p th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
                </p>

            </div>

            <div class="error-message"
                 th:if="${#fields.hasGlobalErrors()}">

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                </p>

            </div>

            <button type="submit"
                    style="width: 100%;">
                Create Account
            </button>

        </form>

        <p style="text-align: center;">

            Already have an account?

            <a th:href="@{/users/login}">
                Login
            </a>

        </p>

        <p style="text-align: center;">

            <a th:href="@{/}">
                ← Back to Home
            </a>

        </p>

    </div>

</div>

</body>
</html>

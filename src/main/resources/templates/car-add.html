<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Car | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<nav>
    <div class="logo">AutoCare</div>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/cars}">
        My Cars
    </a>

    <a th:href="@{/appointments}">
        Appointments
    </a>
</nav>

<div class="container">

    <header class="page-header">
        <h1>Add a Vehicle</h1>

        <p>
            Enter your vehicle information below.
        </p>
    </header>

    <form th:action="@{/cars/add}"
          th:object="${carRequest}"
          method="post">

        <div>
            <label for="make">
                Make
            </label>

            <input id="make"
                   type="text"
                   th:field="*{make}"
                   placeholder="e.g. BMW">

            <p th:if="${#fields.hasErrors('make')}"
               th:errors="*{make}">
            </p>
        </div>

        <div>
            <label for="model">
                Model
            </label>

            <input id="model"
                   type="text"
                   th:field="*{model}"
                   placeholder="e.g. X5">

            <p th:if="${#fields.hasErrors('model')}"
               th:errors="*{model}">
            </p>
        </div>

        <div>
            <label for="registrationNumber">
                Registration Number
            </label>

            <input id="registrationNumber"
                   type="text"
                   th:field="*{registrationNumber}"
                   placeholder="e.g. CA1234AB">

            <p th:if="${#fields.hasErrors('registrationNumber')}"
               th:errors="*{registrationNumber}">
            </p>
        </div>

        <div>
            <label for="productionYear">
                Production Year
            </label>

            <input id="productionYear"
                   type="number"
                   th:field="*{productionYear}"
                   min="1886"
                   max="2100"
                   placeholder="2022">

            <p th:if="${#fields.hasErrors('productionYear')}"
               th:errors="*{productionYear}">
            </p>
        </div>

        <div class="error-message"
             th:if="${#fields.hasGlobalErrors()}">

            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>
        </div>

        <div class="actions">

            <button type="submit">
                Save Car
            </button>

            <a th:href="@{/cars}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>

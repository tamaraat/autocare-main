<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav>

    <div class="logo">
        AutoCare Admin
    </div>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/admin/services}">
        Services
    </a>

    <a th:href="@{/admin/appointments}">
        Appointments
    </a>

    <a th:href="@{/admin/parts}">
        Parts
    </a>

    <a th:href="@{/admin/users}">
        Users
    </a>

</nav>

<div class="container">

    <header class="page-header">

        <h1>
            Manage Users
        </h1>

        <p>
            Review AutoCare accounts
            and manage user roles.
        </p>

    </header>

    <p class="success-message"
       th:if="${param.roleChanged}">
        User role changed successfully.
    </p>

    <table>

        <thead>

        <tr>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Role</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="user : ${users}">

            <td>
                <strong th:text="${user.username}">
                </strong>
            </td>

            <td th:text="${user.firstName}">
            </td>

            <td th:text="${user.lastName}">
            </td>

            <td>

                <span class="badge"
                      th:text="${user.role}">
                </span>

            </td>

            <td>

                <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                      method="post">

                    <button type="submit"
                            th:text="${user.role.name() == 'ADMIN'
                            ? 'Make Customer'
                            : 'Make Admin'}">
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Dashboard | AutoCare</title>
</head>

<body>

<h1>AutoCare Dashboard</h1>

<p th:text="'Hello, ' + ${username} + '!'">
</p>

<nav>

  <a th:href="@{/dashboard}">
    Dashboard
  </a>

  <a th:href="@{/users/profile}">
    My Profile
  </a>

  <a th:href="@{/cars}">
    My Cars
  </a>

  <a th:href="@{/appointments}">
    My Appointments
  </a>

</nav>

<hr>

<h2>Welcome to AutoCare</h2>

<p>
  From here you can manage your cars
  and service appointments.
</p>

<a th:href="@{/cars}">
  My Cars
</a>

<a th:href="@{/appointments}">
  My Appointments
</a>

<a th:href="@{/appointments/add}">
  Book Appointment
</a>

<br><br>

<div sec:authorize="hasRole('ADMIN')">

  <h2>Administration</h2>

  <a th:href="@{/admin/services}">
    Manage Services
  </a>

  <a th:href="@{/admin/appointments}">
    Manage Appointments
  </a>

  <a th:href="@{/admin/parts}">
    Manage Spare Parts
  </a>

  <a th:href="@{/admin/users}">
    Manage Users
  </a>

</div>

<br>

<form th:action="@{/users/logout}"
      method="post">

  <button type="submit">
    Logout
  </button>

</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Service | AutoCare</title>
</head>

<body>

<h1>Add Service</h1>

<form th:action="@{/admin/services/add}"
      th:object="${serviceOfferRequest}"
      method="post">

    <div>

        <label for="name">
            Service Name
        </label>

        <input id="name"
               type="text"
               th:field="*{name}"
               placeholder="Oil Change">

        <p th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}">
        </p>

    </div>

    <br>

    <div>

        <label for="price">
            Price
        </label>

        <input id="price"
               type="number"
               step="0.01"
               th:field="*{price}"
               placeholder="80.00">

        <p th:if="${#fields.hasErrors('price')}"
           th:errors="*{price}">
        </p>

    </div>

    <br>

    <div>

        <label for="durationMinutes">
            Duration in minutes
        </label>

        <input id="durationMinutes"
               type="number"
               th:field="*{durationMinutes}"
               placeholder="60">

        <p th:if="${#fields.hasErrors('durationMinutes')}"
           th:errors="*{durationMinutes}">
        </p>

    </div>

    <div th:if="${#fields.hasGlobalErrors()}">

        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}">
        </p>

    </div>

    <br>

    <button type="submit">
        Add Service
    </button>

</form>

<br>

<a th:href="@{/admin/services}">
    Cancel
</a>

</body>
</html>

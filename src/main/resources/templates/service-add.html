<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Service | AutoCare</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav>

    <div class="logo">
        AutoCare Admin
    </div>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/admin/services}">
        Services
    </a>

    <a th:href="@{/admin/appointments}">
        Appointments
    </a>

    <a th:href="@{/admin/parts}">
        Parts
    </a>

</nav>

<div class="container">

    <header class="page-header">

        <h1>
            Add Service
        </h1>

        <p>
            Create a new service offer for
            AutoCare customers.
        </p>

    </header>

    <form th:action="@{/admin/services/add}"
          th:object="${serviceOfferRequest}"
          method="post">

        <div>

            <label for="name">
                Service Name
            </label>

            <input id="name"
                   type="text"
                   th:field="*{name}"
                   placeholder="Oil Change">

            <p th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">
            </p>

        </div>

        <div>

            <label for="price">
                Price (€)
            </label>

            <input id="price"
                   type="number"
                   step="0.01"
                   min="0.01"
                   th:field="*{price}"
                   placeholder="80.00">

            <p th:if="${#fields.hasErrors('price')}"
               th:errors="*{price}">
            </p>

        </div>

        <div>

            <label for="durationMinutes">
                Duration in Minutes
            </label>

            <input id="durationMinutes"
                   type="number"
                   min="1"
                   th:field="*{durationMinutes}"
                   placeholder="60">

            <p th:if="${#fields.hasErrors('durationMinutes')}"
               th:errors="*{durationMinutes}">
            </p>

        </div>

        <div class="error-message"
             th:if="${#fields.hasGlobalErrors()}">

            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>

        </div>

        <div class="actions">

            <button type="submit">
                Add Service
            </button>

            <a th:href="@{/admin/services}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
